{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cazadores de Ofertas</title>
    <!-- Google Fonts Retro -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Work+Sans:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'feed' %}" class="logo">OFERTAGRAM</a>
            <div class="nav-links">
                <a href="{% url 'feed' %}" class="nav-item">🏠 Feed</a>
                <a href="{% url 'crear_oferta' %}" class="nav-item btn-retro">📸 Subir Oferta</a>
                {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="nav-item">🚪 Salir</a>
                {% else %}
                <a href="{% url 'login' %}" class="nav-item">🔑 Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>Hecho con 👾 por Cazadores de Ofertas</p>
    </footer>
</body>

</html>
